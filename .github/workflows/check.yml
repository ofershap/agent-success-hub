name: Content checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/test_content.py && PYTHONPATH=scripts python3 scripts/test_intake.py && python3 scripts/test_translation.py && python3 scripts/build.py && python3 scripts/build_recipe_pages.py
